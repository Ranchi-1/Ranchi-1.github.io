<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Sign In</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 p-4">
          <div class="text-center mb-4">
            <h1 class="h4 fw-bold">Sign In</h1>
            <p class="text-muted small">Enter your portal credentials to continue</p>
          </div>

          <div id="loginFeedback" class="alert d-none" role="alert"></div>
          
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="usernameInput" class="form-label fw-semibold">Username</label>
              <input type="text" id="usernameInput" class="form-control" placeholder="Enter username" required>
            </div>
            
            <div class="mb-3">
              <label for="passwordInput" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword" aria-label="Toggle password visibility">
                  <span id="toggleText">Show</span>
                </button>
              </div>
            </div>
            
            <button type="submit" id="btnSubmitAuth" class="btn btn-dark w-100 py-2 fw-semibold">Authenticate</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
